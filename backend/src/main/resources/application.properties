# VocabCards Backend Configuration
spring.application.name=vocabcards-backend

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/vocabcards
spring.datasource.username=vocabcards_user
spring.datasource.password=vocabcards_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001

# JWT Configuration
app.jwt.secret=VocabCardsSecretKeyForJWTTokenGenerationAndValidation2024
app.jwt.expiration=86400000

# Logging
logging.level.com.vocabcards=DEBUG
logging.level.org.springframework.security=DEBUG